name: Build and deploy portfolio

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 11 * * *'
  repository_dispatch:
    types: [remote-assets-updated]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  # Superseded pull request runs can stop early; a deploy from main must finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check-remote-assets:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    # Retries back off for about four minutes; anything longer is stuck, not recovering.
    timeout-minutes: 15
    outputs:
      changed: ${{ steps.assets.outputs.changed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      # The fetcher uses only Node built-ins; unchanged days need no npm install.
      - name: Compare remote assets with the deployed snapshot
        id: assets
        run: npm run assets:check

  build:
    needs: check-remote-assets
    if: >-
      always() && !cancelled() &&
      (github.event_name != 'schedule' ||
      (needs.check-remote-assets.result == 'success' && needs.check-remote-assets.outputs.changed == 'true'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Full history, so the sitemap's <lastmod> dates come from real commits.
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Optimizing the photos is nearly all of the build. Astro keys each cached image by its
      # source and transform, so a stale cache is safe and a partial match still saves most of it.
      # Restored after npm ci, which deletes node_modules.
      - name: Restore optimized images
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: node_modules/.astro/assets
          key: astro-images-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/assets/**') }}
          restore-keys: |
            astro-images-${{ hashFiles('package-lock.json') }}-
            astro-images-
      # Dev tooling never reaches visitors, so only shipped dependencies gate the build.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run format:check
      - run: npm run lint
      - run: npm run check
      - run: npm run build
      - run: npm test
      # Flags a dead external link a pull request adds, without blocking it; the daily links
      # workflow tracks breakage on the live site.
      - name: Check external links
        if: github.event_name == 'pull_request'
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        continue-on-error: true
        with:
          args: --no-progress --config lychee.toml --root-dir ${{ github.workspace }}/dist 'dist/**/*.html'
          checkbox: false
      # The browser jobs test this exact build. Photos are already compressed, so zipping them
      # again would only slow the upload.
      - name: Upload the build for browser tests
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: site
          path: dist/
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        if: github.event_name != 'pull_request'
        with:
          path: dist

  # One job per engine, in parallel: each installs only its own browser and system packages.
  browser:
    needs: build
    # The build job can follow a skipped asset check, which would skip this job by default.
    if: always() && !cancelled() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    strategy:
      # A failure in one engine still lets the others report theirs.
      fail-fast: false
      matrix:
        engine: [chromium, firefox, webkit]
    name: browser (${{ matrix.engine }})
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: site
          path: dist
      - name: Install ${{ matrix.engine }}
        run: npx playwright install --with-deps ${{ matrix.engine }}
      # Playwright serves dist/ with astro preview and waits for it before testing. Firefox on
      # Linux creates a WebGL context only with an X display, so a virtual one lets the hero canvas
      # tests run in every engine (rendered in software by Mesa's llvmpipe).
      - name: Run browser and accessibility tests
        run: >-
          xvfb-run --auto-servernum npm run test:browser --
          --project=${{ matrix.engine }} --project=${{ matrix.engine }}-mobile
      - name: Upload browser test results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: browser-test-results-${{ matrix.engine }}
          path: test-results/
          retention-days: 7

  deploy:
    if: >-
      always() && !cancelled() && needs.build.result == 'success' &&
      needs.browser.result == 'success' && github.event_name != 'pull_request'
    needs: [build, browser]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  # Confirms visitors get the new build, then checks the live site end to end. On scheduled runs
  # that deploy nothing, it still checks the site daily for certificate, DNS, or hosting problems.
  verify-live:
    needs: deploy
    if: >-
      always() && !cancelled() &&
      (needs.deploy.result == 'success' ||
      (github.event_name == 'schedule' && needs.deploy.result == 'skipped'))
    runs-on: ubuntu-latest
    # The CDN caches pages for ten minutes; the wait gives up after fifteen.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      # The checker uses only Node built-ins, so no npm install.
      - name: Check the live site
        run: node scripts/verify-live.mjs
        env:
          EXPECTED_COMMIT: ${{ needs.deploy.result == 'success' && github.sha || '' }}
