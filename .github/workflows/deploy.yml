name: Build and deploy portfolio

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 11 * * *'
  repository_dispatch:
    types: [remote-assets-updated]
  workflow_dispatch:

permissions:
  contents: read

# PR updates cancel the run they replace. Main runs prepare builds independently;
# the publication job holds the lock through deployment and CDN verification.
concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Source checks run alongside the build. Each browser tests the same build;
# deployment waits for the checks and every browser to pass.
jobs:
  check-remote-assets:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      changed: ${{ steps.assets.outputs.changed }}

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Compare remote assets with the deployed snapshot
        id: assets
        run: pnpm run assets:check

  checks:
    needs: check-remote-assets
    if: >-
      always() && !cancelled() &&
      (github.event_name != 'schedule' ||
      (needs.check-remote-assets.result == 'success' && needs.check-remote-assets.outputs.changed == 'true'))
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # Scan before dependency installation adds files outside the checkout.
      - name: Scan for secrets
        uses: docker://zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
        with:
          args: dir --redact .

      - name: Lint GitHub Actions
        uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667

      - name: Audit GitHub Actions with zizmor
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          version: 1.31.1
          advanced-security: false
          annotations: true
          online-audits: true
          token: ${{ github.token }}

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting with Prettier
        run: pnpm run format:check

      - name: Lint JavaScript and Astro with ESLint
        run: pnpm run lint:eslint

      - name: Lint styles with Stylelint
        run: pnpm run lint:stylelint

      - name: Check Astro types
        run: pnpm run check

      - name: Lint Markdown
        uses: rvben/rumdl@bb84a49a85625b31ecf6c3e58b7bca7c75fbfefb # v0.2.77
        with:
          version: 0.2.77
          command: check
          path: .
          report-type: annotations

      - name: Check for dead code
        run: pnpm run knip

      # Dev tooling never reaches visitors, so only shipped dependencies gate deployment.
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high

  build:
    needs: check-remote-assets
    if: >-
      always() && !cancelled() &&
      (github.event_name != 'schedule' ||
      (needs.check-remote-assets.result == 'success' && needs.check-remote-assets.outputs.changed == 'true'))
    runs-on: ubuntu-latest
    outputs:
      playwright-image: ${{ steps.playwright-image.outputs.image }}

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # The sitemap takes its lastmod dates from each page's commit history.
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve the locked Playwright image
        id: playwright-image
        run: |
          version=$(node -p "require('@playwright/test/package.json').version")
          tag="v${version}-noble"
          digest=$(curl --fail --silent --show-error --retry 3 --max-time 30 --head \
            --header 'Accept: application/vnd.docker.distribution.manifest.list.v2+json' \
            --output /dev/null --write-out '%header{docker-content-digest}' \
            "https://mcr.microsoft.com/v2/playwright/manifests/${tag}")
          if [[ ! "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "::error::No valid Playwright image digest found for ${tag}"
            exit 1
          fi
          echo "image=mcr.microsoft.com/playwright:${tag}@${digest}" >> "$GITHUB_OUTPUT"

      # Photo transforms dominate the build. Restore them after installation,
      # which can remove the cache; Astro invalidates changed sources itself.
      - name: Restore optimized images
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: node_modules/.astro/assets
          key: astro-images-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/assets/**') }}
          restore-keys: |
            astro-images-${{ hashFiles('pnpm-lock.yaml') }}-
            astro-images-

      - name: Build the production site
        run: pnpm run build

      - name: Test the generated site
        run: pnpm test

      # Photos are already compressed; compressing the artifact saves little.
      - name: Upload the build for browser tests
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: site
          path: dist/
          compression-level: 0
          retention-days: 1

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        if: github.event_name != 'pull_request'
        with:
          path: dist

  external-links:
    needs: build
    if: >-
      always() && !cancelled() && github.event_name == 'pull_request' &&
      needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Download the production build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: site
          path: dist

      # Broken links do not block a pull request. The daily links workflow
      # tracks failures on the live site.
      - name: Check external links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --no-progress --config lychee.toml --root-dir ${{ github.workspace }}/dist 'dist/**/*.html'
          checkbox: false

  browser:
    needs: build
    # A skipped asset check must not skip browsers after a successful build.
    if: always() && !cancelled() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.build.outputs.playwright-image }}
      options: --init --ipc=host
    strategy:
      # Each engine reports its failures even when another fails first.
      fail-fast: false
      matrix:
        engine: [chromium, firefox, webkit]
    name: browser (${{ matrix.engine }})

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download the production build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: site
          path: dist

      - name: Prepare Firefox home directory
        if: matrix.engine == 'firefox'
        # GitHub mounts this directory with a different owner than the container user.
        run: chown "$(id -u):$(id -g)" "$HOME"

      # Firefox on Linux needs an X display for WebGL. A virtual display lets
      # every engine test the hero canvas with Mesa's software renderer.
      - name: Run browser and accessibility tests
        run: >-
          xvfb-run --auto-servernum pnpm run test:browser
          --project=${{ matrix.engine }} --project=${{ matrix.engine }}-mobile

      - name: Upload browser test results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: browser-test-results-${{ matrix.engine }}
          path: test-results/
          retention-days: 7

  deploy:
    if: >-
      always() && !cancelled() && needs.build.result == 'success' &&
      needs.checks.result == 'success' && needs.browser.result == 'success' &&
      github.event_name != 'pull_request'
    needs: [checks, build, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Keep every queued publication: a slower old build must not displace a new one.
    concurrency:
      group: pages-publication
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Skip superseded builds
        id: publication
        run: node scripts/check-publication.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Deploy to GitHub Pages
        if: steps.publication.outputs.current == 'true'
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

      - name: Verify the deployed site
        if: steps.deployment.outcome == 'success'
        run: node scripts/verify-live.mjs
        env:
          EXPECTED_COMMIT: ${{ github.sha }}

  # Scheduled runs that deploy nothing still check the live site. Share the
  # publication lock so a deployment cannot change pages during the check.
  verify-live:
    needs: deploy
    if: >-
      always() && !cancelled() &&
      github.event_name == 'schedule' && needs.deploy.result == 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: pages-publication
      cancel-in-progress: false
      queue: max

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Check the live site
        run: node scripts/verify-live.mjs
