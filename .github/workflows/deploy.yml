name: Build and deploy portfolio

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 11 * * 1'
  repository_dispatch:
    types: [remote-assets-updated]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  # Superseded pull request runs can stop early; a deploy from main must finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, so the sitemap's <lastmod> dates come from real commits.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Dev tooling never reaches visitors, so only shipped dependencies gate the build.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run format:check
      - run: npm run lint
      - run: npm run check
      - run: npm run build
      - run: npm test
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser and accessibility tests
        run: |
          npx astro preview --background --host 127.0.0.1 --port 4322
          trap 'npx astro preview stop || true' EXIT
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:4322/ > /dev/null; then
              break
            fi
            sleep 1
          done
          if ! curl -sf http://127.0.0.1:4322/ > /dev/null; then
            npx astro preview logs || true
            echo "::error::astro preview did not respond on port 4322 within 30 seconds"
            exit 1
          fi
          npm run test:browser
      - name: Upload browser test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-results
          path: test-results/
          retention-days: 7
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
