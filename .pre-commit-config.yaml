default_install_hook_types:
  - pre-commit
  - commit-msg
  - pre-push

default_stages:
  - pre-commit

fail_fast: true

repos:
  - repo: builtin
    hooks:
      - id: check-added-large-files
        args: [--maxkb=15000]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-symlinks
      - id: check-executables-have-shebangs
      - id: trailing-whitespace
      - id: end-of-file-fixer
        exclude: \.gitkeep$
      - id: check-yaml
      - id: check-json
      - id: check-toml

  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: npx prettier --write --ignore-unknown
        language: system
        require_serial: true

      - id: eslint
        name: eslint
        entry: npx eslint
        language: system
        require_serial: true
        files: \.(astro|[jt]sx?|mjs)$

      - id: stylelint
        name: stylelint
        entry: npx stylelint
        language: system
        require_serial: true
        files: \.(astro|css)$

      - id: astro-check
        name: astro check
        entry: npm run check
        language: system
        pass_filenames: false
        files: ^(src/.*\.(astro|[jt]sx?)|tsconfig\.json|astro\.config\.mjs)$

      - id: site-tests
        name: site tests
        entry: npm test
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: astro-build
        name: astro build
        entry: npm run build
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: knip
        name: knip (dead code)
        entry: npm run knip
        language: system
        pass_filenames: false
        stages: [pre-push]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/Goldziher/gitfluff
    rev: v0.8.0
    hooks:
      - id: gitfluff-lint
        args: [--write]
        stages: [commit-msg]

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/rvben/rumdl-pre-commit
    rev: v0.2.77
    hooks:
      - id: rumdl
        args: [--fix]
